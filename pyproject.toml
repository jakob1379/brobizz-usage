[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brobizz-usage"
version = "0.1.0"
description = "CLI and client library for Brobizz trips and account usage JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "platformdirs>=4.10.0",
  "playwright==1.59.0",
  "rich>=15.0.0",
  "typer>=0.26.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "responses>=0.26.1",
]

[project.scripts]
brobizz-usage = "brobizz_usage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brobizz_usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
