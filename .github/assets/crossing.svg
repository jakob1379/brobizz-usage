<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">brobizz-usage: from bridge crossing to trip card</title>
<desc id="d">A car crosses a suspension bridge and passes a toll gantry. The crossing then shows up in a terminal running brobizz-usage trips, rendered as trip cards: pink for an unpaid trip, steel blue for a paid one. Example data.</desc>
<style>
:root{
  --bg:#E9F0F2;--sky-top:#D6E4EA;--sky-bot:#EEF3F4;--water:#B5CAD3;--wave:#9AB5C1;
  --land:#9DB3A5;--steel:#2C4250;--car:#1E2F3A;--guide:#7E97A3;
  --term:#14222B;--term-edge:#14222B;--ink:#D6E2E8;--mute:#8EA3AE;
  --pink:#E2558F;--pink-chip:#AF005F;--blue:#8FB4DA;--blue-chip:#5F87AF;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1B23;--sky-top:#0C1820;--sky-bot:#15252F;--water:#112631;--wave:#1D3A48;
    --land:#1E3631;--steel:#93ABB9;--car:#C9D7DE;--guide:#4D6774;
    --term:#0A131A;--term-edge:#263B48;--ink:#D6E2E8;--mute:#7F95A0;
  }
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
.bg{fill:var(--bg)}
.steel{fill:var(--steel)}
.cable{fill:none;stroke:var(--steel);stroke-width:2.2;stroke-linecap:round}
.hanger{fill:none;stroke:var(--steel);stroke-width:.8;opacity:.6}
.wave{fill:none;stroke:var(--wave);stroke-width:1.4;stroke-linecap:round}
.guide{fill:none;stroke:var(--guide);stroke-width:1.2;stroke-dasharray:2 5;stroke-linecap:round}
.pkt{fill:none;stroke:var(--pink);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:16 120;stroke-dashoffset:16;opacity:0}
.beacon{fill:var(--pink)}
.ring{fill:none;stroke:var(--pink);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.car{transform:translateX(522px)}
.term{fill:var(--term);stroke:var(--term-edge)}
.txt{fill:var(--ink);font-size:12px}
.dim{fill:var(--mute)}
.cmd{font-size:13px}
.curtain{transform:translateX(400px)}
.cur{fill:var(--ink)}
.card{fill:none;stroke-width:1.2}
.chip{font-size:11px;fill:#fff}
.k{opacity:.62}
.p .card{stroke:var(--pink)} .p .chipbg{fill:var(--pink-chip)} .p .v{fill:var(--pink)}
.b .card{stroke:var(--blue)} .b .chipbg{fill:var(--blue-chip)} .b .v{fill:var(--blue)}

.car{animation:drive 10s linear infinite}
.beacon{animation:beacon 10s ease-out infinite}
.ring{animation:ring 10s ease-out infinite}
.pkt{animation:pkt 10s ease-in-out infinite}
.curtain{animation:type 10s infinite}
.o1{animation:o1 10s ease-out infinite}
.o2{animation:o2 10s ease-out infinite}
.o3{animation:o3 10s ease-out infinite}
@keyframes drive{0%{transform:translateX(-40px)}54%,100%{transform:translateX(570px)}}
@keyframes beacon{0%,46%{opacity:.25}47.5%{opacity:1}75%,100%{opacity:.25}}
@keyframes ring{0%,47%{opacity:0;transform:scale(1)}48%{opacity:.9;transform:scale(1)}58%,100%{opacity:0;transform:scale(4)}}
@keyframes pkt{0%,48%{stroke-dashoffset:16;opacity:0}49%{opacity:1}56%{stroke-dashoffset:-118;opacity:1}57%,100%{stroke-dashoffset:-118;opacity:0}}
@keyframes type{0%,56%{transform:translateX(0);animation-timing-function:steps(19,end)}64%{transform:translateX(148px)}66%{transform:translateX(148px)}66.1%,100%{transform:translateX(400px)}}
@keyframes o1{0%,66%{opacity:0}68%,93%{opacity:1}97%,100%{opacity:0}}
@keyframes o2{0%,70%{opacity:0;transform:translateY(6px)}73%,93%{opacity:1;transform:none}97%,100%{opacity:0;transform:none}}
@keyframes o3{0%,75%{opacity:0;transform:translateY(6px)}78%,93%{opacity:1;transform:none}97%,100%{opacity:0;transform:none}}
@media (prefers-reduced-motion: reduce){
  .car,.beacon,.ring,.pkt,.curtain,.o1,.o2,.o3{animation:none}
}
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" style="stop-color:var(--sky-top)"/>
    <stop offset="1" style="stop-color:var(--sky-bot)"/>
  </linearGradient>
  <clipPath id="screen"><rect x="548" y="24" width="336" height="292" rx="10"/></clipPath>
</defs>

<rect class="bg" width="900" height="340"/>

<g>
  <rect x="0" y="0" width="900" height="236" fill="url(#sky)"/>
  <rect x="0" y="234" width="900" height="106" style="fill:var(--water)"/>
  <path class="wave" d="M24 258h40M120 272h28M210 254h54M318 280h36M60 300h46M262 310h30M380 262h22M150 322h50"/>

  <path style="fill:var(--land)" d="M428 203H900V340H428Q446 280 440 236Z"/>

  <path class="hanger" d="M115 98.8V200M82 129.1V200M52 153V200M26 170.4V200M1 181.4V200M170 104.6V200M190 138.8V200M210 164.3V200M230 181.4V200M250 189.9V200M270 189.9V200M290 181.4V200M310 164.3V200M330 138.8V200M350 104.6V200M382 98.6V200M395 130.2V200M409 156.6V200M423 177.8V200"/>
  <path class="cable" d="M-20 186Q40 182 150 62Q260 320 370 62Q400 160 438 194"/>
  <path class="steel" d="M144 240L147.5 52H152.5L156 240ZM364 240L367.5 52H372.5L376 240Z"/>
  <rect class="steel" x="430" y="188" width="14" height="22" rx="1"/>
  <rect class="steel" x="-10" y="197" width="600" height="5"/>

  <g class="steel">
    <rect x="474" y="163" width="3" height="34"/>
    <rect x="493" y="163" width="3" height="34"/>
    <rect x="470" y="158" width="30" height="7" rx="1.5"/>
  </g>
  <circle class="beacon" cx="485" cy="151" r="3.5"/>
  <circle class="ring" cx="485" cy="151" r="3.5"/>

  <g class="car" style="fill:var(--car)">
    <path d="M-17 192V186Q-17 183-14 183H-9L-5 176.5H6L11.5 183H15Q18 183 18 186V192Z"/>
    <circle cx="-9.5" cy="193.5" r="3.4"/>
    <circle cx="10" cy="193.5" r="3.4"/>
  </g>
</g>

<path class="guide" d="M485 146C485 96 512 70 548 66"/>
<path class="pkt" pathLength="100" d="M485 146C485 96 512 70 548 66"/>

<rect class="term" x="548.5" y="24.5" width="335" height="291" rx="10"/>
<g clip-path="url(#screen)" class="mono">
  <text class="txt cmd dim" x="568" y="62">$</text>
  <text class="txt cmd" x="584" y="62" textLength="148" lengthAdjust="spacingAndGlyphs">brobizz-usage trips</text>
  <g class="curtain">
    <rect x="584" y="46" width="190" height="22" style="fill:var(--term)"/>
    <rect class="cur" x="584" y="50" width="8" height="15"/>
  </g>

  <g class="o1">
    <text class="txt" x="568" y="90" font-weight="700">Trips for account 5c0f…e21a</text>
    <text class="txt dim" x="568" y="108" textLength="286" lengthAdjust="spacingAndGlyphs">Showing 2 latest of 2 returned (2 total)</text>
  </g>

  <g class="o2 p">
    <rect class="card" x="566.5" y="124.5" width="301" height="80" rx="6"/>
    <rect class="chipbg" x="578" y="118" width="52" height="14"/>
    <text class="chip" x="604" y="128.5" text-anchor="middle">trip 1</text>
    <g class="txt">
      <text class="v k" x="580" y="150">date</text><text class="v" x="676" y="150">2026-11-24 07:42</text>
      <text class="v k" x="580" y="166">amount</text><text class="v" x="676" y="166">285 DKK</text>
      <text class="v k" x="580" y="182">licenseplate</text><text class="v" x="676" y="182">AB 12 345</text>
      <text class="v k" x="580" y="198">stationName</text><text class="v" x="676" y="198">Storebaelt</text>
    </g>
  </g>

  <g class="o3 b">
    <rect class="card" x="566.5" y="220.5" width="301" height="80" rx="6"/>
    <rect class="chipbg" x="578" y="214" width="52" height="14"/>
    <text class="chip" x="604" y="224.5" text-anchor="middle">trip 2</text>
    <g class="txt">
      <text class="v k" x="580" y="246">date</text><text class="v" x="676" y="246">2026-11-02 16:05</text>
      <text class="v k" x="580" y="262">amount</text><text class="v" x="676" y="262">285 DKK</text>
      <text class="v k" x="580" y="278">licenseplate</text><text class="v" x="676" y="278">AB 12 345</text>
      <text class="v k" x="580" y="294">stationName</text><text class="v" x="676" y="294">Storebaelt</text>
    </g>
  </g>
</g>
</svg>
