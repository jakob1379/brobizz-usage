[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brobizz-usage"
version = "0.1.0"
description = "CLI and client library for Brobizz trips and account usage JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "platformdirs>=4.0",
  "playwright==1.59.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "responses>=0.25",
]

[project.scripts]
brobizz-usage = "brobizz_usage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brobizz_usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
